<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d17" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="cyan-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Filters for Glow -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-purple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .mono-text { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; }
      .sans-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }

      @keyframes pulseOrb {
        0%, 100% { transform: scale(1) translate(0px, 0px); opacity: 0.35; }
        50% { transform: scale(1.15) translate(20px, -15px); opacity: 0.6; }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes flowLight {
        0% { stroke-dashoffset: 400; }
        100% { stroke-dashoffset: 0; }
      }

      .orb-1 { animation: pulseOrb 8s ease-in-out infinite; transform-origin: 200px 100px; }
      .orb-2 { animation: pulseOrb 10s ease-in-out infinite reverse; transform-origin: 1000px 300px; }
      .floating-card { animation: floatSlow 5s ease-in-out infinite; }
      .floating-card-delay { animation: floatSlow 6s ease-in-out infinite 2s; }
      .flow-line { stroke-dasharray: 20, 10; animation: flowLight 20s linear infinite; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bg-grad)" rx="16" />

  <!-- Grid Pattern (Background Layer) -->
  <g opacity="0.12">
    <path d="M 0 60 L 1200 60 M 0 120 L 1200 120 M 0 180 L 1200 180 M 0 240 L 1200 240 M 0 300 L 1200 300 M 0 360 L 1200 360" stroke="#38bdf8" stroke-width="1" />
    <path d="M 100 0 L 100 420 M 200 0 L 200 420 M 300 0 L 300 420 M 400 0 L 400 420 M 500 0 L 500 420 M 600 0 L 600 420 M 700 0 L 700 420 M 800 0 L 800 420 M 900 0 L 900 420 M 1000 0 L 1000 420 M 1100 0 L 1100 420" stroke="#38bdf8" stroke-width="1" />
  </g>

  <!-- Dynamic Glowing Orbs (Behind text) -->
  <circle class="orb-1" cx="220" cy="110" r="140" fill="#06b6d4" filter="url(#glow-cyan)" />
  <circle class="orb-2" cx="980" cy="300" r="160" fill="#a855f7" filter="url(#glow-purple)" />

  <!-- Animated Flow Lines (Behind text) -->
  <path class="flow-line" d="M 50 80 Q 300 20 600 70 T 1150 90" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.3" />
  <path class="flow-line" d="M 50 350 Q 400 400 750 340 T 1150 360" fill="none" stroke="#c084fc" stroke-width="2" opacity="0.25" />

  <!-- Floating Decorative Background Pills / Badges (positioned to not collide with center title) -->
  <g class="floating-card" opacity="0.75">
    <rect x="70" y="320" width="170" height="36" rx="18" fill="url(#card-grad)" stroke="#06b6d4" stroke-width="1.2" />
    <circle cx="90" cy="338" r="5" fill="#10b981" />
    <text x="105" y="343" fill="#cbd5e1" font-size="12" class="mono-text" font-weight="600">⚡ FIM Autocomplete</text>
  </g>

  <g class="floating-card-delay" opacity="0.75">
    <rect x="960" y="70" width="170" height="36" rx="18" fill="url(#card-grad)" stroke="#a855f7" stroke-width="1.2" />
    <circle cx="980" cy="88" r="5" fill="#a855f7" />
    <text x="995" y="93" fill="#cbd5e1" font-size="12" class="mono-text" font-weight="600">🤖 Agentic IDE Harness</text>
  </g>

  <!-- Foreground Main Branding & Titles (Guaranteed Foreground Clarity) -->
  <g id="foreground-content">
    <!-- Top Pill Category Header -->
    <rect x="425" y="45" width="350" height="32" rx="16" fill="#1e293b" stroke="#3b82f6" stroke-width="1.2" />
    <text x="600" y="66" fill="#93c5fd" font-size="12" font-weight="bold" class="sans-text" text-anchor="middle" letter-spacing="1.5">🚀 AWESOME AI DEVELOPER ECOSYSTEM</text>

    <!-- Main Title -->
    <text x="600" y="145" fill="url(#title-grad)" font-size="46" font-weight="900" class="sans-text" text-anchor="middle" letter-spacing="-0.5">
      AI Code Generation &amp; Developer LLMs
    </text>

    <!-- Subtitle / Tagline -->
    <text x="600" y="190" fill="#f8fafc" font-size="18" font-weight="600" class="sans-text" text-anchor="middle">
      Curated Landscape of Autonomous Coding Agents, IDE Copilots &amp; Open Foundation Models
    </text>

    <!-- Detailed Tech Stack Badges / Pillars -->
    <g transform="translate(180, 230)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="185" height="42" rx="8" fill="#111827" stroke="#374151" stroke-width="1.2" />
      <text x="92" y="26" fill="#38bdf8" font-size="13" font-weight="600" class="mono-text" text-anchor="middle">🧠 Coding LLMs</text>

      <!-- Pill 2 -->
      <rect x="205" y="0" width="195" height="42" rx="8" fill="#111827" stroke="#374151" stroke-width="1.2" />
      <text x="302" y="26" fill="#c084fc" font-size="13" font-weight="600" class="mono-text" text-anchor="middle">🛠️ Autonomous Agents</text>

      <!-- Pill 3 -->
      <rect x="420" y="0" width="205" height="42" rx="8" fill="#111827" stroke="#374151" stroke-width="1.2" />
      <text x="522" y="26" fill="#34d399" font-size="13" font-weight="600" class="mono-text" text-anchor="middle">💻 Cloud &amp; Local IDEs</text>

      <!-- Pill 4 -->
      <rect x="645" y="0" width="195" height="42" rx="8" fill="#111827" stroke="#374151" stroke-width="1.2" />
      <text x="742" y="26" fill="#f43f5e" font-size="13" font-weight="600" class="mono-text" text-anchor="middle">⚡ Fast Inference</text>
    </g>

    <!-- Bottom Metadata Description -->
    <text x="600" y="380" fill="#64748b" font-size="13" class="mono-text" text-anchor="middle">
      Enterprise SaaS Benchmarks • Pricing &amp; Free Tier Analysis • Open-Source Repositories Sorted by Stars
    </text>
  </g>
</svg>
