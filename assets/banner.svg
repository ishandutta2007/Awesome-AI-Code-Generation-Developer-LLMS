<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 420"><defs><linearGradient id="bg-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0d17"/><stop offset="50%" stop-color="#0f172a"/><stop offset="100%" stop-color="#050811"/></linearGradient><linearGradient id="title-grad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#60a5fa"/><stop offset="50%" stop-color="#a855f7"/><stop offset="100%" stop-color="#ec4899"/></linearGradient><linearGradient id="cyan-purple" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#06b6d4"/><stop offset="100%" stop-color="#8b5cf6"/></linearGradient><linearGradient id="card-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#1e293b" stop-opacity=".8"/><stop offset="100%" stop-color="#0f172a" stop-opacity=".9"/></linearGradient><filter id="glow-cyan" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="25"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="glow-purple" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="30"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><style>@keyframes pulseOrb{0%{transform:scale(1) translate(0,0);opacity:.35}50%{transform:scale(1.15) translate(20px,-15px);opacity:.6}}@keyframes floatSlow{0%{transform:translateY(0)}50%{transform:translateY(-8px)}}@keyframes flowLight{0%{stroke-dashoffset:400}}.mono-text{font-family:&apos;JetBrains Mono&apos;,&apos;Fira Code&apos;,&apos;Courier New&apos;,monospace}.sans-text{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.orb-1{animation:pulseOrb 8s ease-in-out infinite;transform-origin:200px 100px}.orb-2{animation:pulseOrb 10s ease-in-out infinite reverse;transform-origin:1000px 300px}.floating-card{animation:floatSlow 5s ease-in-out infinite}.floating-card-delay{animation:floatSlow 6